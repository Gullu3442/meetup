<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>MeetUp - Camera Preview</title>
</head>
<body>
    <main class="container">
        <h1 class="text-center">MeetUp camera preview</h1>
        <p class="text-center">Allow camera access to see a local webcam preview.</p>
        <video id="user_video" class="w-100" autoplay muted playsinline aria-label="Your camera preview"></video>
        <p id="camera_status" role="status" aria-live="polite">Requesting camera access...</p>
    </main>
    <script src="/index.js"></script>
</body>
</html>
